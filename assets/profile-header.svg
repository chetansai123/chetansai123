<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chetan Sai Somaraju — Full Stack Engineer</title>
  <desc id="desc">An animated editorial systems map showing a React interface flowing through Node APIs, queues, and data services.</desc>
  <defs>
