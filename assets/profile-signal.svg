<svg width="1200" height="190" viewBox="0 0 1200 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chetan's profile signal board</title>
  <desc id="desc">A compact board showing the kinds of systems Chetan builds and the current profile snapshot.</desc>
  <rect width="1200" height="190" rx="18" fill="#103B52"/>
  <path d="M0 160C160 104 278 210 425 151C563 96 681 171 800 130C938 83 1056 157 1200 99" stroke="#52D3C6" stroke-width="3" stroke-dasharray="5 10" opacity="0.72"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="34" y="37" fill="#F4E9D8" font-size="12" font-weight="800" letter-spacing="2">PROFILE SIGNALS</text>
    <text x="34" y="65" fill="#D5E4E2" font-size="13">A recruiter-readable snapshot of the work behind the repositories.</text>
    <g transform="translate(34 88)">
      <rect width="254" height="72" fill="#F4E9D8"/>
      <rect x="254" width="254" height="72" fill="#FF7849"/>
      <rect x="508" width="254" height="72" fill="#52D3C6"/>
      <rect x="762" width="370" height="72" fill="#F6C85F"/>
      <g fill="#103B52">
        <text x="18" y="25" font-size="26" font-weight="850">35</text><text x="18" y="49" font-size="11" font-weight="750">public repositories</text>
        <text x="272" y="25" font-size="26" font-weight="850">71</text><text x="272" y="49" font-size="11" font-weight="750">contributions / last year</text>
        <text x="526" y="25" font-size="26" font-weight="850">14</text><text x="526" y="49" font-size="11" font-weight="750">active repositories</text>
        <text x="780" y="25" font-size="17" font-weight="850">UI → API → delivery</text><text x="780" y="49" font-size="11" font-weight="750">the systems I like to own end to end</text>
      </g>
    </g>
  </g>
</svg>
