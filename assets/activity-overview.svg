      <text x="42" y="92" fill="#F3F8FB" font-size="30" font-weight="780" letter-spacing="-0.6">Shipping systems, not just screens.</text>
      <text x="42" y="121" fill="#B2C8D2" font-size="14">A compact view of the work behind the pinned repositories.</text>
      <rect x="42" y="154" width="132" height="62" rx="10" fill="#17384C" stroke="#3B667B"/>
      <text x="58" y="179" fill="#F07B5A" font-size="22" font-weight="780">60%</text>
      <text x="58" y="198" fill="#B2C8D2" font-size="11">less scheduler time</text>
      <rect x="186" y="154" width="132" height="62" rx="10" fill="#17384C" stroke="#3B667B"/>
      <text x="202" y="179" fill="#75C5E8" font-size="22" font-weight="780">40%</text>
      <text x="202" y="198" fill="#B2C8D2" font-size="11">faster dashboard</text>
      <rect x="42" y="228" width="132" height="54" rx="10" fill="#17384C" stroke="#3B667B"/>
      <text x="58" y="251" fill="#F3F8FB" font-size="20" font-weight="780">12+</text>
      <text x="58" y="269" fill="#B2C8D2" font-size="11">masking use cases</text>
      <rect x="186" y="228" width="132" height="54" rx="10" fill="#17384C" stroke="#3B667B"/>
      <text x="202" y="251" fill="#F3F8FB" font-size="20" font-weight="780">200+</text>
      <text x="202" y="269" fill="#B2C8D2" font-size="11">automated tests</text>
      <text x="708" y="38" fill="#9AC4D6" font-size="13" font-weight="650">Engineering focus map</text>
      <text x="708" y="58" fill="#7697A7" font-size="11">Work areas, not a fabricated activity score</text>
