<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chetan's build signals and engineering focus map</title>
  <desc id="desc">A flat technical field-notes panel connects React UI, Node APIs, delivery, testing, and product thinking beside verified work-impact metrics.</desc>
  <clipPath id="frame"><rect width="1200" height="320" rx="22"/></clipPath>
